<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="diag" width="46" height="46" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="46" stroke="#0e1c30" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0a1628"/>
  <rect width="1200" height="630" fill="url(#diag)"/>
  <rect x="0" y="0" width="14" height="630" fill="#dc3c37"/>
  <!-- Logo -->
  <rect x="60" y="42" width="56" height="56" rx="14" fill="#dc3c37"/>
  <text x="88" y="72" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">H</text>
  <text x="132" y="76" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">HƯNG HIỆP HUY</text>
  <text x="132" y="102" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#dc3c37">LOGISTICS</text>
