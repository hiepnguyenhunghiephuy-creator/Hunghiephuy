  <text x="60" y="190" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#2da096">KIẾN THỨC LOGISTICS</text>
  <!-- Title -->
  <text x="60" y="272" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="bold" fill="#ffffff">Vận chuyển container</text>
  <text x="60" y="342" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="bold" fill="#ffffff">Bắc – Nam: giá cước &amp;</text>
  <text x="60" y="412" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="bold" fill="#ffffff">thời gian 2026</text>
  <rect x="60" y="448" width="130" height="10" rx="5" fill="#2da096"/>
  <!-- Route graphic -->
  <line x1="985" y1="195" x2="915" y2="300" stroke="#788c9b" stroke-width="4" stroke-dasharray="14 10"/>
  <line x1="845" y1="360" x2="810" y2="470" stroke="#788c9b" stroke-width="4" stroke-dasharray="14 10"/>
  <!-- Container -->
  <rect x="825" y="298" width="110" height="64" rx="8" fill="none" stroke="#2da096" stroke-width="4"/>
  <line x1="838" y1="302" x2="838" y2="358" stroke="#2da096" stroke-width="3"/>
  <line x1="852" y1="302" x2="852" y2="358" stroke="#2da096" stroke-width="3"/>
  <line x1="866" y1="302" x2="866" y2="358" stroke="#2da096" stroke-width="3"/>
  <line x1="880" y1="302" x2="880" y2="358" stroke="#2da096" stroke-width="3"/>
  <line x1="894" y1="302" x2="894" y2="358" stroke="#2da096" stroke-width="3"/>
  <line x1="908" y1="302" x2="908" y2="358" stroke="#2da096" stroke-width="3"/>
  <line x1="922" y1="302" x2="922" y2="358" stroke="#2da096" stroke-width="3"/>
  <!-- Pin: HÀ NỘI (teal) -->
  <g>
    <circle cx="1010" cy="112" r="26" fill="#2da096"/>
    <polygon points="984,120 1036,120 1010,160" fill="#2da096"/>
    <circle cx="1010" cy="112" r="11" fill="#ffffff"/>
  </g>
  <text x="1010" y="205" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">HÀ NỘI</text>
  <!-- Pin: TP.HCM (red) -->
  <g>
    <circle cx="790" cy="442" r="26" fill="#dc3c37"/>
    <polygon points="764,450 816,450 790,490" fill="#dc3c37"/>
